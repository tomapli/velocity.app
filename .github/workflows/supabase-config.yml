name: Supabase config

# Pushes pending migrations (`supabase db push`) then supabase/config.toml Auth
# settings (including allowlist hooks) via `supabase config push`. Migrations
# must apply first so the Postgres hook functions exist before config references them.
#
# Google OAuth credentials are decrypted from supabase/.env.production with
# dotenvx (DOTENV_PRIVATE_KEY_PRODUCTION).

on:
  push:
    branches:
      - main
    paths:
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/.env.production
      - .github/workflows/supabase-config.yml
  workflow_dispatch:

concurrency:
  group: supabase-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-config:
    name: Push migrations and config
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - name: Require secrets and variables
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access Tokens)."
            exit 1
          fi

          if [ -z "${SUPABASE_PRODUCTION_PROJECT_REF}" ]; then
            echo "::error::Set repository variable SUPABASE_PRODUCTION_PROJECT_REF to the Supabase project ref."
            exit 1
          fi

          if [ -z "${DOTENV_PRIVATE_KEY_PRODUCTION}" ]; then
            echo "::error::Add repository secret DOTENV_PRIVATE_KEY_PRODUCTION (value from supabase/.env.keys)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push migrations
        run: >
          pnpm exec supabase db push
          --project-ref "${SUPABASE_PRODUCTION_PROJECT_REF}"
          --yes

      - name: Push config.toml
        # Private key comes from DOTENV_PRIVATE_KEY_PRODUCTION (file is gitignored).
        run: >
          pnpm exec dotenvx run -f supabase/.env.production --
          pnpm exec supabase config push
          --project-ref "${SUPABASE_PRODUCTION_PROJECT_REF}"
          --yes
