name: Supabase config

# Pushes supabase/config.toml Auth settings (including allowlist hooks) to the
# hosted project via `supabase config push`. Requires migrations already applied
# so the Postgres hook functions exist.

on:
  push:
    branches:
      - main
    paths:
      - supabase/config.toml
      - .github/workflows/supabase-config.yml
  workflow_dispatch:

concurrency:
  group: supabase-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-config:
    name: Push config
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
    steps:
      - name: Require secrets and variables
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access Tokens)."
            exit 1
          fi

          if [ -z "${SUPABASE_PRODUCTION_PROJECT_REF}" ]; then
            echo "::error::Set repository variable SUPABASE_PRODUCTION_PROJECT_REF to the Supabase project ref."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push config.toml
        run: >
          pnpm exec supabase config push
          --project-ref "${SUPABASE_PRODUCTION_PROJECT_REF}"
          --yes
